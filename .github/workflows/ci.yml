name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # packages is set explicitly because the action's DEFAULT is "tools platform-tools", and
      # Google has withdrawn the obsolete "tools" package from the SDK repository - sdkmanager
      # now exits 1 with "Failed to find package 'tools'" and the whole build dies before it
      # reaches a line of this project's code. Naming what we need also folds the old separate
      # install step in here, so there is one list of SDK packages rather than two.
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle :logic:test :app:testDebugUnitTest

      # Gradle's test task passes trivially when it finds nothing to run, so a green check
      # would otherwise be meaningless. Count the real cases and fail if a module ran none.
      - name: Verify tests actually ran
        run: |
          logic=$(cat logic/build/test-results/test/*.xml | grep -o '<testcase ' | wc -l)
          app=$(cat app/build/test-results/testDebugUnitTest/*.xml | grep -o '<testcase ' | wc -l)
          echo "Logic tests: $logic"
          echo "Android tests: $app"
          echo "Executed tests: $((logic + app))"
          if [ "$logic" -eq 0 ] || [ "$app" -eq 0 ]; then
            echo "::error::A test module executed nothing - refusing to report a green build."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug

      # The failure this catches shipped once and cost a tester two installs: the APK verified,
      # aligned and parsed perfectly, and still would not go on because it carried a DIFFERENT
      # signing key from the build already on the device. Nothing about the APK looks wrong when
      # that happens, so the only way to see it is to compare the certificate against the one
      # this project is supposed to sign with.
      - name: The APK must carry the project's own signing key
        run: |
          expected=54:55:EE:4D:0E:91:A7:18:15:3A:B6:63:52:B8:98:EA:5D:B0:23:CC:7F:FA:4A:70:EE:97:4D:AD:22:68:4C:D5
          expected=$(echo "$expected" | tr -d ':' | tr '[:upper:]' '[:lower:]')
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs \
            app/build/outputs/apk/debug/app-debug.apk \
            | awk '/certificate SHA-256 digest/ {print $NF; exit}')
          echo "expected: $expected"
          echo "actual:   $actual"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Signed with the wrong key - this APK cannot install over an existing Reserve. Is reserve.keystore being picked up?"
            exit 1
          fi
          echo "Signing key matches; this APK can update an existing install."

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: reserve-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            logic/build/test-results/test/*.xml
            app/build/test-results/testDebugUnitTest/*.xml

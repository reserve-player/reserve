name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Unit tests + debug APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run unit tests
        run: gradle :logic:test :app:testDebugUnitTest

      # Gradle's test task passes trivially when it finds nothing to run, so a green check
      # would otherwise be meaningless. Count the real cases and fail if a module ran none.
      - name: Verify tests actually ran
        run: |
          logic=$(cat logic/build/test-results/test/*.xml | grep -o '<testcase ' | wc -l)
          app=$(cat app/build/test-results/testDebugUnitTest/*.xml | grep -o '<testcase ' | wc -l)
          echo "Logic tests: $logic"
          echo "Android tests: $app"
          echo "Executed tests: $((logic + app))"
          if [ "$logic" -eq 0 ] || [ "$app" -eq 0 ]; then
            echo "::error::A test module executed nothing - refusing to report a green build."
            exit 1
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: reserve-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            logic/build/test-results/test/*.xml
            app/build/test-results/testDebugUnitTest/*.xml
